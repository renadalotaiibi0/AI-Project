name: Publish Zid Riwaq storefront

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check the storefront pages
        run: test -s index.html && test -s merchant.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload the customer and merchant pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: |
            index.html
            merchant.html
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
